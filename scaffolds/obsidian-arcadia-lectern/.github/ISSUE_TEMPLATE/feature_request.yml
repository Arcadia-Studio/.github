name: Feature request
description: Suggest a capability for Arcadia Lectern
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The preparation task that is currently awkward or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you picture it working in the sidebar, a command, or settings.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Any workaround you currently use, including other plugins.
